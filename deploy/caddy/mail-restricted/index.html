<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Access Restricted</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #101418;
      color: #f4f7f9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      border-top: 6px solid #45a36b;
    }

    main {
      width: min(680px, 100%);
      border-left: 3px solid #45a36b;
      padding: 8px 0 8px 28px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      max-width: 58ch;
      color: #c8d0d6;
      font-size: 1.1rem;
      line-height: 1.65;
    }

    strong { color: #ffffff; }
  </style>
</head>
<body>
  <main>
    <h1>Email access is restricted</h1>
    <p>
      The full mailbox is available only from <strong>WINSANDBOX-VM</strong>.
      Use RustDesk to connect to the sandbox and open
      <strong>mail.alderpen.lan</strong> there.
    </p>
  </main>
</body>
</html>
